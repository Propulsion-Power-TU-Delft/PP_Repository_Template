name: Automated regression tests

on:
  push:
    branches:
      - 'develop'
      - 'main'
  pull_request:
    branches:
      - 'develop'
      - 'main'

jobs:

  run_regression:
    name: Run tests in Docker container
    runs-on: ubuntu-latest
    steps:
      - name: Pre Cleanup
        uses: docker://ghcr.io/propulsion-power-tu-delft/pp_template_test:latest
        with:
          entrypoint: /bin/rm 
          args: -rf src/

      - name: Run regression tests
        uses: docker://ghcr.io/propulsion-power-tu-delft/pp_template_test:latest
        with:
          args: -b ${{ github.ref }} -s run_regression.py
      
      - name: Post Cleanup
        uses: docker://ghcr.io/propulsion-power-tu-delft/pp_template_test:latest
        with:
          entrypoint: /bin/rm 
          args: -rf src/

